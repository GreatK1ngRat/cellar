services:
  cellar:
    build: .
    container_name: cellar
    restart: unless-stopped
    ports:
      - "61618:61618"
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-inclusionai/ling-3.0-flash-vl:free}
    volumes:
      - /opt/docker/cellar:/app/data
