services:
  cellar:
    build: .
    container_name: cellar
    restart: unless-stopped
    ports:
      - "61618:61618"
    environment:
      APP_PASSWORD: ${APP_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    volumes:
      - /opt/docker/cellar:/app/data
